name: snore_clinics
description: SnoreClinics AI — Monitor, analyze & improve your sleep with AI-driven insights.
publish_to: 'none'
version: 2.0.0+12

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  provider: ^6.1.2

  # Animations
  flutter_animate: ^4.5.2

  # Audio recording
  record: ^6.2.0

  # Health data (Steps, Heart Rate)
  health: ^13.0.0

  # Audio playback (relaxation sounds)
  just_audio: ^0.10.5

  # HTTP
  http: ^1.2.0

  # File picker for audio files
  file_picker: ^8.1.0

  # FFT / amplitude analysis
  fftea: ^1.2.0

  # Charts for sleep visualization
  fl_chart: ^1.2.0

  # Local notifications (bedtime reminders)
  flutter_local_notifications: ^17.0.0

  # Overnight background execution
  flutter_foreground_task: ^9.2.2

  # Gemini AI
  google_generative_ai: ^0.4.6

  # Unique IDs
  uuid: ^4.4.0

  # Permissions
  permission_handler: ^12.0.2

  # Timezones for notifications
  timezone: ^0.9.0

  # Firebase
  firebase_core: ^4.9.0
  firebase_auth: ^6.5.1
  cloud_firestore: ^6.4.1
  firebase_messaging: ^16.4.1

  # Google Sign-In
  google_sign_in: ^6.2.1

  # Persist data
  shared_preferences: ^2.2.3

  # Confetti on milestones
  confetti: ^0.8.0

  # Premium typography
  google_fonts: ^8.1.0


  # Path utilities
  path_provider: ^2.1.3
  path: ^1.9.0

  # UI utilities
  intl: ^0.20.2
  cupertino_icons: ^1.0.6
  table_calendar: ^3.1.2
  url_launcher: ^6.3.2
  flutter_markdown: ^0.7.3

  # Video playback (for the Video Library feature)
  video_player: ^2.9.2
  flutter_dotenv: ^6.0.1
  share_plus: ^10.1.0

  # Use device_info_plus 11.x to avoid the isiOSAppOnVision compile error on CI
  # Version 12.4.0 introduced VisionOS code that requires a specific Xcode SDK
  device_info_plus: ^11.3.0
  pdf: ^3.12.0
  printing: ^5.14.3

  # .docx parsing (ZIP extraction)
  archive: ^3.6.0

  # Actigraphy — accelerometer for sleep stage refinement
  sensors_plus: ^6.1.0
  firebase_storage: ^13.4.3
  xml: ^6.6.1
  tflite_flutter: ^0.12.1

dependency_overrides:
  # Override device_info_plus to 11.x to avoid iOS ARC compile error with isiOSAppOnVision
  device_info_plus: ^11.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.0

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 24

flutter_native_splash:
  color: "#0F1120"
  image: "assets/images/app_icon.png"
  android: true
  ios: true
  fullscreen: true

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/models/
    - .env
