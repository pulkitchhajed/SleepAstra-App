name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    name: Build iOS App
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.2'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Disable Flutter Swift Package Manager
        run: flutter config --no-enable-swift-package-manager

      - name: Clean Build Artifacts
        run: |
          flutter clean
          rm -rf ios/Pods
          rm -rf ios/Podfile.lock

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Generate Flutter iOS build files
        run: |
          flutter build ios --release --no-codesign || true

      - name: Install CocoaPods Dependencies
        working-directory: ios
        run: pod install --repo-update

      - name: Build iOS with xcodebuild (Unsigned)
        run: |
          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/ios/xcode \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            build

      - name: Package into IPA
        run: |
          APP_PATH=$(find build/ios/xcode/Build/Products -name "Runner.app" | head -1)
          echo "Found app at: $APP_PATH"
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/Runner.app
          zip -qq -r snore_clinics_ios_unsigned.ipa Payload
          echo "IPA created successfully"

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v7
        with:
          name: ios-ipa-unsigned
          path: snore_clinics_ios_unsigned.ipa
          retention-days: 7
